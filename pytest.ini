[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: Unit tests for standalone tools, data loaders, and models
    scenario: Integration and scenario tests for API endpoints and end-to-end flows
    reproduction: Regression and reproduction tests for fixed issues
    tier1: Tier 1 Feature Coverage tests
    tier2: Tier 2 Boundary and Corner tests
    tier3: Tier 3 Cross-Feature Pairwise tests
    tier4: Tier 4 Real-World Scenario tests
    adversarial: Adversarial stress tests and boundary challenge tests

filterwarnings =
    ignore::DeprecationWarning
